<!DOCTYPE html>

<html class="light" lang="vi"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Tuyển Dụng VN - Đăng nhập</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

            darkMode: "class",

                extend: {

                        "surface-container-highest": "#e0e3e5",
                        "on-primary-container": "#eeefff",
                        "secondary-fixed": "#dbe1ff",
                        "tertiary": "#943700",
                        "on-surface": "#191c1e",
                        "on-background": "#191c1e",
                        "inverse-surface": "#2d3133",
                        "primary-fixed-dim": "#b4c5ff",
                        "on-error": "#ffffff",
                        "on-tertiary": "#ffffff",
                        "on-tertiary-container": "#ffede6",
                        "on-primary": "#ffffff",
                        "surface-tint": "#0053db",
                        "surface-container-low": "#f2f4f6",
                        "outline-variant": "#c3c6d7",
                        "inverse-on-surface": "#eff1f3",
                        "secondary-fixed-dim": "#b4c5ff",
                        "error": "#ba1a1a",
                        "surface-variant": "#e0e3e5",

                        "secondary": "#495c95",

                        "on-primary-fixed-variant": "#003ea8",
                        "background": "#f7f9fb",
                        "surface-bright": "#f7f9fb",
                        "outline": "#737686",
                        "on-tertiary-fixed-variant": "#7d2d00",

                    "borderRadius": {

                    "fontFamily": {
                        "headline": ["Inter"],

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .glass-effect {
            backdrop-filter: blur(12px);
            background-color: rgba(255, 255, 255, 0.8);
        }
        .editorial-shadow {
            shadow-color: rgba(25, 28, 30, 0.05);
            box-shadow: 0 20px 40px -10px rgba(0, 74, 198, 0.08);
        }
        .gradient-primary {
            background: linear-gradient(135deg, #004ac6 0%, #2563eb 100%);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface font-body text-on-surface min-h-screen flex flex-col items-center">
<!-- Top AppBar (Simulated Mobile Header for Identity) -->
<header class="w-full top-0 flex items-center justify-between px-6 py-6 bg-surface z-50">
<div class="flex items-center gap-3">
<div class="w-8 h-8 gradient-primary rounded-lg flex items-center justify-center">
<span class="material-symbols-outlined text-white text-lg">work</span>
</div>
<span class="text-xl font-bold tracking-tight text-on-surface">Tuyển Dụng VN</span>
</div>
</header>
<main class="w-full max-w-[420px] px-6 pb-12 flex-grow flex flex-col justify-center">
<!-- Visual Accent (Collaborative Workspace Adapted for Mobile) -->
<div class="relative w-full h-48 mb-8 rounded-xl overflow-hidden editorial-shadow">
<div class="absolute inset-0 bg-primary/20 mix-blend-multiply z-10"></div>
<img alt="Professional collaborative workspace" class="w-full h-full object-cover" data-alt="Modern collaborative office space with professional people working on laptops in a bright airy architecturally designed studio" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCIq4M2yE45sbLGJPVPzeZBz-_HI40TtqmyMs5IjZbbj9OS1I_-pLzl0baTWW4CLOOb8Hhs9gDeCY7nLU4UceWXYgs9pGPMr8qFieCtPz7xlpj4dSiSWARvMQ2SJ03TfN9AQyRHBdU1ByVcjejVBXl0YxvMwPTITs9OOz82K4no4VGWuH5y1boPUrhYpg2zaxx0Lof_Q-_YVsTGn8_5amU4C6uso08qHAAn1VD-Sr1DnyDxhFjgyU39-YeW_01tH7INRo70ec-1e5yW"/>
<div class="absolute inset-0 bg-gradient-to-t from-primary/60 to-transparent z-20"></div>
<div class="absolute bottom-4 left-4 z-30">
<span class="text-white font-medium text-sm tracking-wider uppercase opacity-90">Hành trình sự nghiệp</span>
</div>
</div>
<!-- Login Card -->
<div class="bg-surface-container-lowest p-8 rounded-xl editorial-shadow border border-outline-variant/10">
<div class="mb-8">
<h1 class="text-2xl font-bold text-on-surface tracking-tight mb-2">Chào mừng quay trở lại</h1>
<p class="text-on-surface-variant text-sm leading-relaxed">Tiếp tục hành trình xây dựng sự nghiệp kiến trúc của bạn tại đây.</p>
</div>
<form class="space-y-6">
<!-- Email Input -->
<div class="space-y-2">
<label class="text-xs font-bold text-on-surface-variant uppercase tracking-widest ml-1" for="email">Email</label>
<div class="relative">
<input class="w-full px-4 py-3.5 rounded-xl bg-surface-container-low border-transparent focus:border-primary-container focus:ring-0 transition-all text-on-surface placeholder:text-outline outline-none" id="email" placeholder="name@company.com" type="email"/>
</div>
</div>
<!-- Password Input -->
<div class="space-y-2">
<div class="flex justify-between items-center px-1">
<label class="text-xs font-bold text-on-surface-variant uppercase tracking-widest" for="password">Mật khẩu</label>
<a class="text-xs font-semibold text-primary-container hover:text-primary transition-colors" href="#">Quên mật khẩu?</a>
</div>
<div class="relative">
<input class="w-full px-4 py-3.5 rounded-xl bg-surface-container-low border-transparent focus:border-primary-container focus:ring-0 transition-all text-on-surface placeholder:text-outline outline-none" id="password" placeholder="••••••••" type="password"/>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-outline-variant" type="button">
<span class="material-symbols-outlined text-[20px]">visibility</span>
</button>
</div>
</div>
<!-- Action Button -->
<button class="w-full py-4 gradient-primary text-white font-bold rounded-xl shadow-lg shadow-primary/20 active:scale-[0.98] transition-all" type="submit">
                    Đăng nhập
                </button>
</form>
<!-- Social Login -->
<div class="mt-8">
<div class="relative flex items-center py-4">
<div class="flex-grow border-t border-outline-variant/20"></div>
<span class="flex-shrink mx-4 text-xs font-bold text-outline uppercase tracking-tighter">Hoặc đăng nhập với</span>
<div class="flex-grow border-t border-outline-variant/20"></div>
</div>
<div class="grid grid-cols-2 gap-4 mt-4">
<button class="flex items-center justify-center gap-3 py-3 rounded-xl border border-outline-variant/20 bg-surface-container-low hover:bg-surface-container-high transition-colors">
<svg class="w-5 h-5" viewbox="0 0 24 24">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
</svg>
<span class="text-sm font-semibold text-on-surface">Google</span>
</button>
<button class="flex items-center justify-center gap-3 py-3 rounded-xl border border-outline-variant/20 bg-surface-container-low hover:bg-surface-container-high transition-colors">
<svg class="w-5 h-5" fill="#0077B5" viewbox="0 0 24 24">
<path d="M19 3a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h14m-.5 15.5v-5.3a3.26 3.26 0 0 0-3.26-3.26c-.85 0-1.84.52-2.32 1.3v-1.11h-2.79v8.37h2.79v-4.93c0-.77.62-1.4 1.39-1.4a1.4 1.4 0 0 1 1.4 1.4v4.93h2.79M6.88 8.56a1.68 1.68 0 0 0 1.68-1.68c0-.93-.75-1.69-1.68-1.69a1.69 1.69 0 0 0-1.69 1.69c0 .93.76 1.68 1.69 1.68m1.39 9.94v-8.37H5.5v8.37h2.77z"></path>
</svg>
<span class="text-sm font-semibold text-on-surface">LinkedIn</span>
</button>
</div>
</div>
</div>
<!-- Footer -->
<div class="mt-8 text-center">
<p class="text-on-surface-variant text-sm">
                Chưa có tài khoản? 
                <a class="text-primary-container font-bold ml-1 hover:underline underline-offset-4" href="#">Đăng ký ngay</a>
</p>
</div>
</main>
<!-- Bottom Navigation Bar (Suppressed for transactional screens as per protocol, but visual padding kept) -->
<footer class="w-full py-4 text-center">
<p class="text-[10px] text-outline-variant uppercase tracking-widest font-bold">© 2024 Tuyển Dụng VN • Tuyển dụng cao cấp</p>
</footer>
</body></html>
